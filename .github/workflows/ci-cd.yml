name: AI Assistant CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  ci-frontend:
    name: Build & Check Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build project
        working-directory: frontend
        run: npm run build

  ci-backend:
    name: Build & Check Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build project
        working-directory: backend
        run: npm run build

  ci-ai-engine:
    name: Build & Check AI Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ai_engine
        run: pip install -r requirements.txt

  deploy-render-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: ci-backend
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deploy (Backend)
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}" ]; then
            echo "Missing RENDER_DEPLOY_HOOK_BACKEND secret"
            exit 1
          fi
          echo "Triggering deployment..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}"

  deploy-render-ai:
    name: Deploy AI Engine to Render
    runs-on: ubuntu-latest
    needs: ci-ai-engine
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deploy (AI Engine)
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_AI }}" ]; then
            echo "Missing RENDER_DEPLOY_HOOK_AI secret"
            exit 1
          fi
          echo "Triggering deployment..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_AI }}"
